services:
  - type: web
    name: face-recognition-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/data/users.db
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data/
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_NAME
        value: ArcFace
      - key: DETECTOR_BACKEND
        value: ssd
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/health
    autoDeploy: true
