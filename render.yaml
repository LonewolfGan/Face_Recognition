services:
  - type: web
    name: face-recognition-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && python migrate.py
    startCommand: gunicorn --chdir backend -c gunicorn.conf.py run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --preload
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data/
      - key: CORS_ORIGINS
        value: https://face-recognition-lovat-eight.vercel.app
      - key: MODEL_NAME
        value: ArcFace
      - key: DETECTOR_BACKEND
        value: opencv
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/health
    autoDeploy: false
