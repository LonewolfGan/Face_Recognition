<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance Faciale</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="camera-container">
            <video id="videoPreview" playsinline autoplay></video>
            <div id="faceGuideOverlay">
                <div class="face-outline"></div>
                <div class="positioning-tips">Positionnez votre visage dans le cadre</div>
            </div>
        </div>
        <div class="controls">
            <button id="addFace" class="btn">Ajouter un visage</button>
            <button id="askAccess" class="btn">Vérifier l'accès</button>
        </div>
        <div id="errorMsg" class="error-container"></div>
        
         <!-- Section utilisateur (cachée par défaut) -->
        <div id="userSection" class="user-section hidden">
            <div class="user-header">
                <h2 id="userName">Utilisateur</h2>
                <button id="logoutBtn" class="btn btn-small">Déconnexion</button>
            </div>
            
            <!-- Section notes -->
            <div id="notesContainer" class="notes-container">
                <h3>Mes Notes</h3>
                <div id="notesList" class="notes-list">
                    <!-- Les notes seront ajoutées ici dynamiquement -->
                </div>
                <div class="note-controls">
                    <button id="addNoteBtn" class="btn">Ajouter une note</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
